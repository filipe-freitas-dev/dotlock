[package]
name = "dotlock-bin"
version = "0.1.6"
edition = "2024"
description = "Encrypted project-local environment variables manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/filipe-freitas-dev/dotlock"
readme = "README.md"
keywords = ["cli", "secrets", "env", "encryption"]
categories = ["command-line-utilities"]

[[bin]]
name = "dl"
path = "src/main.rs"

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3"
crypto_box = { version = "0.9.1", features = ["seal"] }
ed25519-dalek = { version = "3.0.0", features = ["pem", "pkcs8", "zeroize"] }
getrandom = "0.4.2"
hkdf = "0.13.0"
hmac = "0.13.0"
inquire = "0.7"
pkcs8 = { version = "0.11.0", features = ["encryption", "getrandom", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9.8", features = ["pem", "sha2", "pkcs5"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
subtle = "2.6"
thiserror = "2.0.18"
toml = "1.1.2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
